<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile README Generator</title>
  <link rel="stylesheet" href="style.css">
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <svg height="28" viewBox="0 0 16 16" width="28" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
      <span>GitHub Profile README Studio</span>
    </div>
    <div class="header-actions">
      <button id="copyBtn" class="btn btn-secondary">Copy Markdown</button>
      <button id="downloadBtn" class="btn btn-primary">Download README.md</button>
    </div>
  </header>

  <main class="main-container">
    <!-- Editor Column -->
    <section class="pane editor-pane">
      <div class="pane-header">
        <div class="tabs">
          <button class="tab-btn active" data-tab="form">Form Builder</button>
          <button class="tab-btn" data-tab="raw">Raw Markdown</button>
        </div>
      </div>
      <div class="pane-body">
        
        <!-- Form View -->
        <div id="formView" class="tab-content active">
          <form id="readmeForm">
            <div class="form-group">
              <label for="name">Full Name / Display Name</label>
              <input type="text" id="name" value="Jane Doe" placeholder="e.g. John Doe">
            </div>

            <div class="form-group">
              <label for="title">Title / Subtitle</label>
              <input type="text" id="title" value="Full-Stack Developer & Open Source Enthusiast" placeholder="e.g. Frontend Engineer">
            </div>

            <div class="form-group">
              <label for="githubUser">GitHub Username</label>
              <input type="text" id="githubUser" value="octocat" placeholder="e.g. octocat">
            </div>

            <div class="form-group">
              <label for="about">About Me (Bullet points, markdown supported)</label>
              <textarea id="about" rows="4">- 🔭 I’m currently working on Web Applications
- 🌱 I’m currently learning Rust and WebAssembly
- 💬 Ask me about React, Node.js, and CSS Architecture
- ⚡ Fun fact: I love specialty coffee</textarea>
            </div>

            <div class="form-group">
              <label>Skills & Technologies</label>
              <div class="tech-checkboxes" id="skillsContainer">
                <label><input type="checkbox" value="javascript" checked> JavaScript</label>
                <label><input type="checkbox" value="typescript" checked> TypeScript</label>
                <label><input type="checkbox" value="react" checked> React</label>
                <label><input type="checkbox" value="nodejs" checked> Node.js</label>
                <label><input type="checkbox" value="html5" checked> HTML5</label>
                <label><input type="checkbox" value="css3" checked> CSS3</label>
                <label><input type="checkbox" value="python"> Python</label>
                <label><input type="checkbox" value="git" checked> Git</label>
                <label><input type="checkbox" value="docker"> Docker</label>
              </div>
            </div>

            <div class="form-group">
              <label for="twitter">Twitter / X Username (Optional)</label>
              <input type="text" id="twitter" value="janedoe" placeholder="username">
            </div>

            <div class="form-group">
              <label for="linkedin">LinkedIn Username (Optional)</label>
              <input type="text" id="linkedin" value="janedoe" placeholder="username">
            </div>
          </form>
        </div>

        <!-- Raw Editor View -->
        <div id="rawView" class="tab-content">
          <textarea id="rawMarkdown" rows="25" placeholder="Write markdown here..."></textarea>
        </div>

      </div>
    </section>

    <!-- Preview Column -->
    <section class="pane preview-pane">
      <div class="pane-header">
        <span>README Preview</span>
      </div>
      <div class="pane-body">
        <div id="markdownPreview" class="markdown-body"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
